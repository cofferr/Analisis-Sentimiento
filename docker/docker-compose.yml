services:
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    image: nlp-lab2-mlflow:latest
    container_name: nlp-lab2-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/data
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    image: nlp-lab2-api:latest
    container_name: nlp-lab2-api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: nlp-lab2-sentiment140
      MLFLOW_REGISTERED_MODEL_NAME: sentiment140
      MLFLOW_MODEL_ALIAS: champion
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mlflow_data:
  mlflow_artifacts:
